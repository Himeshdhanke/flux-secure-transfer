# ==============================================================================
# SecureShare — Nginx Production Reverse Proxy Configuration
# ==============================================================================

server {
    listen 80;
    server_name your-secureshare-domain.com;

    # Security HTTP headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;

    # Maximum upload size for PDF files
    client_max_body_size 25M;

    # Frontend Single Page Application (Static assets)
    location / {
        root /var/www/secureshare/client/dist;
        try_files $uri $uri/ /index.html;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Backend API Reverse Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Disable buffering for on-demand watermarked image streaming
        proxy_buffering off;
    }

    # Health check endpoint for EC2 Application Load Balancer
    location /health {
        proxy_pass http://127.0.0.1:5000/health;
        proxy_set_header Host $host;
    }
}
